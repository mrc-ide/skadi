<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>skadi</title>
  </head>
  <body>
    <!-- Config for basic store -->
    <div class="w-storeCfg"
         w-store="basic"
         w-sync="xrange"></div>
    
    <div class="w-graphCfg"
         w-id="1"
         w-store="basic"
         w-vars="R, S"
         w-fixedid="main, sc1"></div>

    <div class="w-parCfg"
         w-store="basic"
         w-par="beta"
         w-val="4"
         w-min="1"
         w-max="6"
         w-step="0.1"></div>

    <div class="w-parCfg"
         w-store="basic"
         w-par="sigma"
         w-val="2"
         w-min="0"
         w-max="2.5"
         w-step="0.1"></div>

    <!-- Visual elements -->
    <div class="w-par" w-store="basic" w-par="beta"></div>
    <div class="w-par" w-store="basic" w-par="beta"></div>
    <div class="w-par" w-store="basic" w-par="sigma"></div>

    <div class="w-form" w-store="basic" w-formid="f1" style="margin-top: 20px;"></div>
    <p>Some text in between</p>
    <div class="w-form" w-store="basic" w-formid="f2" style="margin-top: 20px;"></div>

    <div class="graph-container">
      <div class="w-plot" data-w-type="ref" w-store="basic" w-id="1"></div>
      <div class="w-plot" data-w-type="ref" w-store="basic" w-id="1"></div>
      <div class="w-plot" data-w-type="cfg" w-store="basic" w-vars="S, I" w-fixedid="sc1, sc2"></div>
      <div class="w-plot" data-w-type="diff" w-ylock w-store="basic" w-vars="R, S" w-yrange="-10000000,10000000" w-fixedid1="main" w-fixedid2="sc1"></div>
    </div>



    <div class="w-storeCfg"
         w-store="basic:1"
         w-sync="xrange, yrange"></div>
    
    <div class="w-graphCfg"
         w-id="2"
         w-store="basic:1"
         w-vars="I"></div>

    <div class="w-parCfg"
         w-store="basic:1"
         w-par="beta"
         w-val="4"
         w-min="1"
         w-max="10"
         w-step="0.1"></div>

    <div class="w-par" w-store="basic:1" w-par="beta"></div>

    <div class="graph-container">
      <div class="w-plot" data-w-type="ref" w-store="basic:1" w-id="2"></div>
      <div class="w-plot" data-w-type="ref" w-store="basic:1" w-id="2"></div>
      <div class="w-plot" data-w-type="cfg" w-store="basic:1" w-vars="S, R"></div>
    </div>


    <script type="module" src="/src/index.tsx"></script>
  </body>
  <style>
  .w-plot {
    width: 33%;
  }

  .graph-container {
    display: flex;
  }
  </style>
</html>
